<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="description" content="World Hub — каталог активных миров Terraria Mobile">
<title>World Hub — Миры Terraria Mobile</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="offline">Нет соединения · показываем кэш</div>

<header>
  <h1>World Hub</h1>
  <p>Активные миры Terraria Mobile</p>
</header>

<main>
  <div class="controls">
    <div class="search" id="searchWrap">
      <input id="search" type="search" placeholder="Поиск по имени, IP, режиму..."
             autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="clear" id="searchClear" aria-label="Очистить">×</button>
    </div>

    <div class="chips-row" id="modeChips"></div>
    <div class="chips-row" id="mapChips"></div>

    <div class="sort-row" id="sortRow">
      <button class="seg" data-sort="online">Онлайн</button>
      <button class="seg" data-sort="players">Игроки</button>
      <button class="seg" data-sort="name">Имя</button>
    </div>
  </div>

  <div id="list"></div>
</main>

<footer>World Hub · не связан с Re-Logic</footer>
<div class="toast" id="toast">Скопировано</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cache.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
